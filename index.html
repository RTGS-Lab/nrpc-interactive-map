<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <!-- width=device-width is what makes a phone lay the page out at its own
       width instead of the 980px desktop default it otherwise assumes.
       viewport-fit=cover puts the map under the notch; the mobile CSS pays it
       back with env(safe-area-inset-*) on every fixed control. -->
  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>NRPC Interactive Map</title>

  <!-- ArcGIS Styles -->
  <link rel="stylesheet" href="https://js.arcgis.com/4.29/esri/themes/light/main.css" />

  <!-- External Styles -->
  <link rel="stylesheet" href="styles.css" />

  <!-- JSZip must load BEFORE ArcGIS to avoid AMD multipleDefine conflict -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- ArcGIS JavaScript API -->
  <script src="https://js.arcgis.com/4.29/"></script>
</head>

<body>
  <div id="viewDiv"></div>
  <!-- Demo sign-in card over the map (demo / demo). A front door for a
       forwarded link, not access control: the site is static and every asset
       is public. Loads first so the card is up before ArcGIS boots. -->
  <script src="js/demo-login.js"></script>
  <script src="js/config.js"></script>
  <script src="js/shp-writer.js"></script>
  <script src="js/export-utils.js"></script>
  <!-- A .docx is a ZIP of XML parts, so this reuses the JSZip above rather
       than adding a dependency. Nothing on the page requires it: the DOCX
       button says so if it is missing. -->
  <script src="js/docx-writer.js"></script>
  <!-- One companion panel over the map at a time. Must load before the two
       panels that register with it. -->
  <script src="js/panel-exclusivity.js"></script>
  <!-- Which model results layer the report reads (v1 today, V2 when published).
       Must load before report-maps.js and parcel-report.js. -->
  <script src="js/model-config.js"></script>
  <!-- The maps that go in the exported PDF and DOCX. Captured off-screen on a
       second MapView so the user's map never moves. -->
  <script src="js/report-maps.js"></script>
  <script src="js/parcel-report.js"></script>
  <!-- Mobile only defines window.NRPCMobile; parcel-report.js calls into it at
       the end of init(), and it returns immediately on a desktop. -->
  <script src="js/mobile.js"></script>
  <script src="js/main.js"></script>
  <!-- Inert unless the URL carries ?dev-print=1. Drives the export path from a
       URL so the PRINTED page can be regression-tested in a real browser —
       Firefox's print engine is not Chrome's. See docs/dev-print.md. -->
  <script src="js/dev-print.js"></script>
</body>

</html>
